    <script src="https://cdn.tailwindcss.com"></script>

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: {
                            bg: '#FDFBF7',
                            card: '#FFFFFF',
                            primary: '#D4A373',

        body {
            font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
            background-color: #FDFBF7;
            color: #4A3F35;
        }
        .cream-box {
            border: 3px solid #4A3F35;
            border-radius: 26px;
            box-shadow: 4px 4px 0px #4A3F35;
            transition: all 0.2s ease;
        }
        .cream-btn {
            border: 2.5px solid #4A3F35;
            border-radius: 18px;
            box-shadow: 3px 3px 0px #4A3F35;
            transition: all 0.12s ease;
        }
        .cream-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #4A3F35;
        }
        .polaroid {
            background: #FFFFFF;
            padding: 10px 10px 28px 10px;
            border: 2.5px solid #4A3F35;
            border-radius: 8px;
            box-shadow: 3px 3px 0px rgba(74, 63, 53, 0.28);
            transform: rotate(-1.2deg);
            transition: transform 0.25s ease;
        }
        .polaroid:nth-child(even) {
            transform: rotate(1.4deg);
        }
        .polaroid:hover {
            transform: scale(1.03) rotate(0deg);
            z-index: 10;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }
        .floating {
            animation: float 3.2s ease-in-out infinite;
        }
        @keyframes cardPop {
            0% { transform: scale(0.75) translateY(20px); opacity: 0; }
            70% { transform: scale(1.03) translateY(-4px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .card-pop {
            animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

    <!-- 底部固定導覽列 -->

    <script>
        // ==================== 1. 工具與防 XSS / 雲端圖片轉換 ====================
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeCloudImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            const trimmed = url.trim();
            if (!trimmed) return '';
            if (trimmed.startsWith('data:image/')) return trimmed;

            // 自動將 Google Drive 分享連結轉為穩定的 lh3 直連格式
            const driveFileMatch = trimmed.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (driveFileMatch && driveFileMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveFileMatch[1]}`;
            }
            const driveOpenMatch = trimmed.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
            if (driveOpenMatch && driveOpenMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveOpenMatch[1]}`;
            }
            const driveUcMatch = trimmed.match(/drive\.google\.com\/uc\?.*id=([a-zA-Z0-9_-]+)/);
            if (driveUcMatch && driveUcMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveUcMatch[1]}`;
            }
            return trimmed;
        }

        // 農場星球預設插畫 (Google Drive 直連 + SVG 備援)
        const PLANET_IMAGE_URL = "https://lh3.googleusercontent.com/d/14YkCxyGzwGftiol19JgZs3Whev6nzVF9";

        function renderPlanetArtwork(sizeClass = "w-44 h-44") {
            return `
                <div class="relative ${sizeClass} mx-auto flex items-center justify-center">
                    <img src="${PLANET_IMAGE_URL}"
                         alt="婚貴悠閒農場星球"
                         class="w-full h-full object-contain drop-shadow-md"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div style="display:none" class="w-full h-full rounded-full bg-gradient-to-br from-cream-sage via-cream-secondary to-cream-primary border-4 border-cream-text flex-col items-center justify-center shadow-inner">
                        <span class="text-5xl">🌍</span>
                        <span class="text-[11px] font-extrabold text-cream-text mt-1">FARM PLANET</span>
                    </div>
                </div>
            `;
        }

        // ==================== 2. 預設資料結構 (單一預設空白 gasUrl) ====================
        const DEFAULT_INGREDIENTS = {

            'carrot': { id: 'carrot', name: '紅蘿蔔', nameEn: 'Carrot', category: 'farm', seedEmoji: '❓', imageUrl: '', prep: '去皮切小塊蒸軟，加少許溫水打成細泥。', history: [] },
            'broccoli': { id: 'broccoli', name: '花椰菜', nameEn: 'Broccoli', category: 'farm', seedEmoji: '❓', imageUrl: '', prep: '取花蕾部分川燙熟透，去除粗纖維後打泥。', history: [] },
            'pumpkin': { id: 'pumpkin', name: '南瓜', nameEn: 'Pumpkin', category: 'farm', seedEmoji: '❓', imageUrl: '', prep: '去皮去籽蒸熟壓泥，口感綿密香甜。', history: [] },
            'sweet_potato': { id: 'sweet_potato', name: '地瓜', nameEn: 'Sweet Potato', category: 'farm', seedEmoji: '❓', imageUrl: '', prep: '蒸熟壓泥加溫水調稀，亦可做為 BLW 手指食物。', history: [] },
            'potato': { id: 'potato', name: '馬鈴薯', nameEn: 'Potato', category: 'farm', seedEmoji: '❓', imageUrl: '', prep: '去皮切塊蒸熟壓泥，加入高湯或奶水拌勻。', history: [] },

            'bok_choy': { id: 'bok_choy', name: '青江菜', nameEn: 'Bok Choy', category: 'farm', seedEmoji: '❓', imageUrl: '', prep: '取翠綠嫩葉川燙熟透，打成細緻菜泥。', history: [] },

            // 果樹區（水果）
            'apple': { id: 'apple', name: '蘋果泥', nameEn: 'Apple', category: 'orchard', seedEmoji: '❓', imageUrl: '', prep: '蘋果洗淨去皮磨成泥，初期可先蒸熟軟化餵食。', history: [] },
            'banana': { id: 'banana', name: '香蕉泥', nameEn: 'Banana', category: 'orchard', seedEmoji: '❓', imageUrl: '', prep: '選熟透帶斑點香蕉，湯匙直接刮泥壓碎。', history: [] },
            'avocado': { id: 'avocado', name: '酪梨', nameEn: 'Avocado', category: 'orchard', seedEmoji: '❓', imageUrl: '', prep: '熟透酪梨質地綿密富含好油脂，直接壓泥。', history: [] },
            'papaya': { id: 'papaya', name: '木瓜', nameEn: 'Papaya', category: 'orchard', seedEmoji: '❓', imageUrl: '', prep: '選熟軟木瓜去皮去籽後用湯匙刮泥。', history: [] },
            'pear': { id: 'pear', name: '水梨泥', nameEn: 'Pear', category: 'orchard', seedEmoji: '❓', imageUrl: '', prep: '去皮去核蒸熟或磨泥，清甜多汁。', history: [] },
            'blueberry': { id: 'blueberry', name: '藍莓泥', nameEn: 'Blueberry', category: 'orchard', seedEmoji: '❓', imageUrl: '', prep: '洗淨蒸軟壓泥過篩，富含花青素。', history: [] },
            'kiwi': { id: 'kiwi', name: '奇異果', nameEn: 'Kiwi', category: 'orchard', seedEmoji: '❓', imageUrl: '', prep: '選擇軟熟黃金奇異果壓泥，注意酸度。', history: [] },

            // 魚池（魚類/海鮮）
            'salmon': { id: 'salmon', name: '鮭魚泥', nameEn: 'Salmon', category: 'fish', seedEmoji: '❓', imageUrl: '', prep: '蒸熟去皮並仔細檢查無刺，壓碎融入粥品。', history: [] },
            'cod': { id: 'cod', name: '鱈魚泥', nameEn: 'Cod Fish', category: 'fish', seedEmoji: '❓', imageUrl: '', prep: '輪切鱈魚蒸熟，小心挑除細刺後壓泥。', history: [] },
            'sea_bass': { id: 'sea_bass', name: '鱸魚泥', nameEn: 'Sea Bass', category: 'fish', seedEmoji: '❓', imageUrl: '', prep: '取無刺鱸魚菲力清蒸熟透，打成細魚泥。', history: [] },
            'whitebait': { id: 'whitebait', name: '吻仔魚', nameEn: 'Whitebait', category: 'fish', seedEmoji: '❓', imageUrl: '', prep: '選無漂白新鮮吻仔魚川燙去鹹味，加入粥熬煮。', history: [] },
            'shrimp': { id: 'shrimp', name: '蝦仁泥', nameEn: 'Shrimp', category: 'fish', seedEmoji: '❓', imageUrl: '', prep: '去殼去腸泥煮熟剁細或打泥（注意甲殼類過敏）。', history: [] },

            // 牧場區（蛋白質/肉類/蛋豆）
            'chicken': { id: 'chicken', name: '雞肉泥', nameEn: 'Chicken', category: 'pasture', seedEmoji: '❓', imageUrl: '', prep: '雞里肌或雞胸切小塊水煮熟透，加高湯打泥。', history: [] },
            'pork': { id: 'pork', name: '豬肉泥', nameEn: 'Pork', category: 'pasture', seedEmoji: '❓', imageUrl: '', prep: '豬里肌肉去除筋膜蒸熟，調理機打成細泥。', history: [] },
            'beef': { id: 'beef', name: '牛肉泥', nameEn: 'Beef', category: 'pasture', seedEmoji: '❓', imageUrl: '', prep: '選牛菲力富含鐵質，煮熟加少許高湯打泥。', history: [] },
            'egg_yolk': { id: 'egg_yolk', name: '水煮蛋黃', nameEn: 'Egg Yolk', category: 'pasture', seedEmoji: '❓', imageUrl: '', prep: '全熟水煮蛋取出蛋黃，加溫水或奶調成糊狀。', history: [] },
            'tofu': { id: 'tofu', name: '嫩豆腐', nameEn: 'Silken Tofu', category: 'pasture', seedEmoji: '❓', imageUrl: '', prep: '非基改嫩豆腐沸水川燙殺菌後壓碎即可。', history: [] },
            'edamame': { id: 'edamame', name: '毛豆泥', nameEn: 'Edamame', category: 'pasture', seedEmoji: '❓', imageUrl: '', prep: '煮熟剝除豆仁外層薄膜後打成細泥。', history: [] },

            // 溫室（菇類）
            'shiitake': { id: 'shiitake', name: '香菇', nameEn: 'Shiitake Mushroom', category: 'greenhouse', seedEmoji: '❓', imageUrl: '', prep: '取鮮香菇傘面嫩部分煮熟剁細或打泥。', history: [] },
            'king_oyster': { id: 'king_oyster', name: '杏鮑菇', nameEn: 'King Oyster Mushroom', category: 'greenhouse', seedEmoji: '❓', imageUrl: '', prep: '切小塊蒸軟後打成細末，口感滑順。', history: [] },
            'enoki': { id: 'enoki', name: '金針菇', nameEn: 'Enoki Mushroom', category: 'greenhouse', seedEmoji: '❓', imageUrl: '', prep: '切除根部並切極細段煮熟打泥，避免纖維過長。', history: [] },
            'wood_ear': { id: 'wood_ear', name: '黑木耳', nameEn: 'Black Fungus', category: 'greenhouse', seedEmoji: '❓', imageUrl: '', prep: '新鮮黑木耳洗淨煮軟後打成細泥，富含膳食纖維。', history: [] }
        };

        const DEFAULT_STATE = {
            owner: {
                nameZh: "婚貴",
                nameEn: "fen-guo",
                birthDate: "2026-06-07",
                avatarUrl: ""
            },
            ingredients: JSON.parse(JSON.stringify(DEFAULT_INGREDIENTS)),
            customIngredients: [],
            achievements: [],
            polaroids: {},
            gasUrl: "" // 單一預設空白雲端網址（未貼上則純本地單機模式，不進行任何雲端連線）
        };

        let state = loadInitialState();

        function loadInitialState() {
            try {
                const raw = localStorage.getItem('hngui_farm_state');
                if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
                const parsed = JSON.parse(raw);

                // 清理舊版遺留欄位，確保資料結構一致
                delete parsed.ingredientsGasUrl;
                if (!parsed.owner) parsed.owner = { ...DEFAULT_STATE.owner };
                if (!parsed.ingredients) parsed.ingredients = JSON.parse(JSON.stringify(DEFAULT_INGREDIENTS));
                if (!Array.isArray(parsed.customIngredients)) parsed.customIngredients = [];
                if (!Array.isArray(parsed.achievements)) parsed.achievements = [];
                if (!parsed.polaroids) parsed.polaroids = {};
                if (typeof parsed.gasUrl !== 'string') parsed.gasUrl = "";

                // 確保每個食材皆具備 imageUrl 與 history 結構
                Object.keys(parsed.ingredients).forEach(k => {
                    const item = parsed.ingredients[k];
                    delete item.unlockEmoji;
                    if (!Array.isArray(item.history)) item.history = [];
                    if (!item.seedEmoji) item.seedEmoji = '❓';
                    if (typeof item.imageUrl !== 'string') item.imageUrl = '';
                });

                return parsed;
            } catch (e) {
                console.error("讀取本地狀態失敗，載入預設值", e);
                return JSON.parse(JSON.stringify(DEFAULT_STATE));
            }
        }

        function saveStateSilently() {
            try {
                localStorage.setItem('hngui_farm_state', JSON.stringify(state));
            } catch (e) {
                console.error("LocalStorage 寫入失敗:", e);
                showToast('⚠️ 瀏覽器儲存空間已滿，建議設定 GAS 雲端同步或刪除舊資料！');
            }
        }

        function saveState(skipCloudPush = false) {
            saveStateSilently();
            updateHeaderInfo();
            checkAchievements();
            if (!skipCloudPush && getActiveGasUrl()) {
                pushFamilyRecordsToCloud(true);
            }
        }

        // ==================== 3. 雲端同步邏輯 (單一預設空白 gasUrl) ====================
        function getActiveGasUrl() {
            return (state.gasUrl && state.gasUrl.trim().startsWith('http'))
                ? state.gasUrl.trim()
                : '';
        }

        // 開機時檢查：僅當使用者有在「農場主人」頁面貼上 gasUrl 時才自動同步
        async function initCloudSyncOnBoot() {
            const targetUrl = getActiveGasUrl();
            if (!targetUrl) return; // 未貼網址時完全不連線、不跳錯誤
            await loadCloudEncyclopedia(true);
            await pullFamilyRecordsFromCloud(true);
        }

        // 手動點擊同步按鈕
        async function manualCloudSync() {
            const targetUrl = getActiveGasUrl();
            if (!targetUrl) {
                showToast('ℹ️ 尚未貼上 GAS 網址，目前為單機模式');
                return;
            }
            showToast('⏳ 正在與 Google 試算表同步中...');

        // 讀取同一份試算表的「Ingredients」工作表
        async function loadCloudEncyclopedia(silent = false) {
            const targetUrl = getActiveGasUrl();
            if (!targetUrl) return;

            try {
                const sep = targetUrl.includes('?') ? '&' : '?';
                const response = await fetch(`${targetUrl}${sep}action=ingredients`);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const cloudItems = await response.json();

                if (Array.isArray(cloudItems) && cloudItems.length > 0) {
                    const updatedMap = {};
                    cloudItems.forEach((raw, idx) => {
                        const name = (raw.name || '').toString().trim();
                        if (!name) return;
                        const id = (raw.id || ('sheet_item_' + idx)).toString().trim();
                        const category = ['farm', 'orchard', 'fish', 'pasture', 'greenhouse'].includes(raw.category)
                            ? raw.category
                            : 'farm';
                        const imgUrl = normalizeCloudImageUrl(raw.imageUrl || '');

                        // 比對既有歷史紀錄（優先依 id，其次依名稱）
                        let existingHistory = [];
                        if (state.ingredients[id] && Array.isArray(state.ingredients[id].history)) {
                            existingHistory = state.ingredients[id].history;
                        } else {
                            const foundByName = Object.values(state.ingredients).find(x => x.name === name);
                            if (foundByName && Array.isArray(foundByName.history)) {
                                existingHistory = foundByName.history;
                            }
                        }

                        updatedMap[id] = {
                            id,
                            name,
                            nameEn: (raw.nameEn || '').toString().trim(),
                            category,
                            seedEmoji: (raw.seedEmoji || '❓').toString().trim() || '❓',
                            imageUrl: imgUrl,
                            prep: (raw.prep || '依寶寶月齡調整質地與軟硬度。').toString().trim(),
                            history: existingHistory
                        };
                    });

                    if (Object.keys(updatedMap).length > 0) {
                        state.ingredients = updatedMap;
                        saveStateSilently();
                        updateHeaderInfo();
                        if (!silent) showToast(`📖 已從試算表同步 ${Object.keys(updatedMap).length} 項食材圖鑑！`);
                    }
                }
            } catch (err) {
                console.error("雲端圖鑑同步失敗:", err);
                if (!silent) showToast('⚠️ 圖鑑同步失敗，請確認 GAS 網址與部署權限');
            }
        }

        // 讀取同一份試算表的「FamilyRecords」工作表（全家人共用紀錄）
        async function pullFamilyRecordsFromCloud(silent = false) {
            const targetUrl = getActiveGasUrl();
            if (!targetUrl) return;

            try {
                const sep = targetUrl.includes('?') ? '&' : '?';
                const response = await fetch(`${targetUrl}${sep}action=get_state`);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const cloudState = await response.json();

                if (cloudState && cloudState.status !== 'empty') {
                    // 合併試吃紀錄
                    if (cloudState.ingredients && typeof cloudState.ingredients === 'object') {
                        Object.keys(cloudState.ingredients).forEach(id => {
                            const cItem = cloudState.ingredients[id];
                            if (state.ingredients[id] && Array.isArray(cItem.history)) {
                                state.ingredients[id].history = cItem.history;
                            } else if (cItem && cItem.name) {
                                const match = Object.values(state.ingredients).find(x => x.name === cItem.name);
                                if (match && Array.isArray(cItem.history)) {
                                    match.history = cItem.history;
                                }
                            }
                        });
                    }
                    if (Array.isArray(cloudState.customIngredients)) {
                        state.customIngredients = cloudState.customIngredients;
                    }
                    if (cloudState.polaroids && typeof cloudState.polaroids === 'object') {
                        state.polaroids = cloudState.polaroids;
                    }
                    if (cloudState.owner && typeof cloudState.owner === 'object') {
                        state.owner = { ...state.owner, ...cloudState.owner };
                    }
                    if (Array.isArray(cloudState.achievements)) {
                        const mergedAch = new Set([...state.achievements, ...cloudState.achievements]);
                        state.achievements = Array.from(mergedAch);
                    }

                    saveStateSilently();
                    updateHeaderInfo();
                    if (!silent) showToast('☁️ 已同步最新全家人紀錄！');
                }
            } catch (err) {
                console.error("讀取家人雲端紀錄失敗:", err);
                if (!silent) showToast('⚠️ 讀取雲端紀錄失敗，請確認 GAS 已更新為最新部署版本');
            }
        }

        // 寫入全家人共用紀錄至「FamilyRecords」工作表
        async function pushFamilyRecordsToCloud(silent = true) {
            const targetUrl = getActiveGasUrl();
            if (!targetUrl) return;

            try {
                // 過濾掉未上傳至雲端硬碟的過大 Base64 字串，避免超過試算表 50,000 字元上限
                const cleanPayload = JSON.parse(JSON.stringify(state));
                delete cleanPayload.gasUrl;

                if (cleanPayload.owner.avatarUrl && cleanPayload.owner.avatarUrl.startsWith('data:image/')) {
                    cleanPayload.owner.avatarUrl = '';
                }
                Object.keys(cleanPayload.polaroids || {}).forEach(k => {
                    const p = cleanPayload.polaroids[k];
                    if (p && p.imageUrl && p.imageUrl.startsWith('data:image/')) {
                        p.imageUrl = '';
                    }
                });

                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(cleanPayload)
                });
                const resJson = await response.json();
                if (resJson.status === 'ok') {
                    if (!silent) showToast('☁️ 已成功同步至您的 Google 試算表！');
                } else if (!silent) {
                    showToast(`⚠️ 雲端同步異常：${resJson.message || '請檢查 GAS 設定'}`);
                }
            } catch (err) {
                console.error("上傳雲端紀錄失敗:", err);
                if (!silent) showToast('⚠️ 雲端寫入失敗，請檢查網路或 GAS 部署權限');
            }
        }

        // 將壓縮後的 Base64 圖片透過 GAS 上傳至 Google 雲端硬碟取得直連網址
        async function uploadImageToCloudDrive(base64DataUrl, prefix = 'photo') {
            const targetUrl = getActiveGasUrl();
            if (!targetUrl) return base64DataUrl; // 單機模式直接回傳本地壓縮圖

            const response = await fetch(targetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'upload_image',
                    base64: base64DataUrl,
                    mimeType: 'image/jpeg',
                    fileName: `${prefix}_${Date.now()}.jpg`
                })
            });

            if (!response.ok) throw new Error('HTTP ' + response.status);
            const result = await response.json();
            if (result.status === 'ok' && result.imageUrl) {
                return result.imageUrl;
            }
            throw new Error(result.message || '雲端硬碟未回傳圖片網址');
        }

        // 圖片壓縮工具 (Canvas)
        function compressImageFile(file, maxDimension = 720, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            } else {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ==================== 5. 輔助計算函式 ====================
        function getBabyAgeString() {
            if (!state.owner.birthDate) return '尚未設定生日';
            const birth = new Date(state.owner.birthDate + 'T00:00:00');
            const now = new Date();
            if (isNaN(birth.getTime())) return '生日格式無效';
            if (now < birth) {
                const diffDays = Math.ceil((birth - now) / (1000 * 60 * 60 * 24));
                return `距離預產/出生還有 ${diffDays} 天`;
            }
            let months = (now.getFullYear() - birth.getFullYear()) * 12 + (now.getMonth() - birth.getMonth());
            let days = now.getDate() - birth.getDate();
            if (days < 0) {
                months--;
                const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
                days += prevMonthLastDay;
            }
            return `月齡：${Math.max(0, months)} 個月 ${days} 天`;
        }

        function getAllIngredientsList() {
            return [...Object.values(state.ingredients), ...state.customIngredients];
        }

        function findIngredientById(id) {
            return state.ingredients[id] || state.customIngredients.find(i => i.id === id);
        }

        function getAllRecords() {
            const records = [];
            getAllIngredientsList().forEach(ing => {
                (ing.history || []).forEach((h, idx) => {
                    records.push({
                        ...h,
                        ingredientId: ing.id,
                        ingredientName: ing.name,
                        recordIndex: idx
                    });
                });
            });
            return records;
        }

        function getTriedCount() {
            return getAllIngredientsList().filter(i => (i.history || []).length > 0).length;
        }

        function getUnlockedCount() {
            return getAllIngredientsList().filter(i => (i.history || []).length >= 3).length;
        }

        function hasEatenCategory(s, cat) {
            return [...Object.values(s.ingredients), ...s.customIngredients].some(i => i.category === cat && (i.history || []).length > 0);
        }

        function countCategoryUnlocked(s, cat) {
            return [...Object.values(s.ingredients), ...s.customIngredients].filter(i => i.category === cat && (i.history || []).length >= 3).length;
        }

        function getUniqueRecordDates() {
            const set = new Set();
            getAllRecords().forEach(r => { if (r.date) set.add(r.date); });
            return set;
        }

        function getNotesCount() {
            return getAllRecords().filter(r => r.notes && r.notes.trim().length > 0).length;
        }

        function getAllergyCount() {
            return getAllIngredientsList().filter(ing =>
                (ing.history || []).some(h => h.reaction === 'mild' || h.reaction === 'moderate' || h.reaction === 'severe')
            ).length;
        }

        // --- 2. 軌道式農場星球地圖 (逆時針旋轉 15 度) ---
        function renderFarmMapView() {
            const cleanAvatar = normalizeCloudImageUrl(state.owner.avatarUrl);
            const avatarHtml = cleanAvatar
                ? `<img src="${escapeHtml(cleanAvatar)}" class="w-14 h-14 rounded-full object-cover border-3 border-cream-text shadow-md bg-white">`
                : `<div class="w-14 h-14 rounded-full bg-cream-secondary flex items-center justify-center text-2xl border-3 border-cream-text shadow-md">👶</div>`;

            // 六個區域沿圓形軌道逆時針旋轉 15 度配置
            const zones = [
                { id: 'farm', name: '農田區', sub: '五穀/蔬菜', icon: '🌾', angleDeg: -105 },
                { id: 'orchard', name: '果樹區', sub: '水果', icon: '🍎', angleDeg: -165 },
                { id: 'fish', name: '魚池', sub: '魚類/海鮮', icon: '🐟', angleDeg: 135 },
                { id: 'pasture', name: '牧場區', sub: '蛋白質/肉類', icon: '🥩', angleDeg: 75 },
                { id: 'greenhouse', name: '溫室', sub: '菇類', icon: '🍄', angleDeg: 15 },
                { id: 'farmhouse', name: '農舍', sub: '30項成就牆', icon: '🏡', angleDeg: -45 }
            ];

            const zoneButtonsHtml = zones.map(z => {
                const rad = (z.angleDeg * Math.PI) / 180;
                const radiusPct = 38; // 軌道半徑百分比
                const leftPct = 50 + radiusPct * Math.cos(rad);
                const topPct = 50 + radiusPct * Math.sin(rad);

                return `
                    <button onclick="goToZoneWithAnimation('${z.id}', this)"
                            style="left: ${leftPct.toFixed(1)}%; top: ${topPct.toFixed(1)}%; transform: translate(-50%, -50%);"
                            class="absolute bg-white/95 hover:bg-cream-secondary cream-btn px-2.5 py-1.5 sm:px-3 sm:py-2 flex items-center space-x-1.5 z-10 whitespace-nowrap">
                        <span class="text-lg sm:text-xl">${z.icon}</span>
                        <div class="text-left">
                            <div class="text-[11px] sm:text-xs font-extrabold leading-tight">${z.name}</div>
                            <div class="text-[9px] text-cream-muted font-bold leading-tight">${z.sub}</div>
                        </div>
                    </button>
                `;
            }).join('');

            return `
                <div class="flex flex-col items-center py-2 space-y-4">
                    <div class="w-full flex items-center justify-between">
                        <button onclick="router.navigate('home')" class="cream-btn bg-white px-3 py-1.5 text-xs font-extrabold">
                            ⬅️ 返回首頁
                        </button>
                        <h2 class="text-base sm:text-lg font-extrabold">🚜 婚貴農場星球地圖</h2>
                        <div class="w-16"></div>
                    </div>

                    <div class="relative w-full max-w-md aspect-square bg-gradient-to-br from-cream-secondary/40 via-cream-bg to-cream-sage/30 cream-box flex items-center justify-center overflow-hidden">
                        <!-- 軌道虛線圓環 -->
                        <div class="absolute w-[76%] h-[76%] rounded-full border-2 border-dashed border-cream-text/30 pointer-events-none"></div>

                        <!-- 中央星球插畫 -->
                        <div class="pointer-events-none opacity-90">
                            ${renderPlanetArtwork("w-40 h-40 sm:w-48 sm:h-48")}
                        </div>

                        <!-- 正中央農場小主人 -->
                        <div id="farm-character" class="absolute z-20 flex flex-col items-center transition-all duration-500 pointer-events-none">
                            ${avatarHtml}
                            <span class="bg-cream-text text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold mt-1 shadow">
                                ${escapeHtml(state.owner.nameZh)}
                            </span>
                        </div>

                        ${zoneButtonsHtml}
                    </div>
                    <p class="text-xs text-cream-muted font-bold text-center">💡 點擊軌道上的農場區域，小主人就會出發前往探索！</p>
                </div>
            `;
        }

        function goToZoneWithAnimation(category, btnElement) {
            const charEl = document.getElementById('farm-character');
            if (charEl && btnElement) {
                const rect = btnElement.getBoundingClientRect();
                const parentRect = charEl.parentElement.getBoundingClientRect();
                const targetX = rect.left - parentRect.left + rect.width / 2 - parentRect.width / 2;
                const targetY = rect.top - parentRect.top + rect.height / 2 - parentRect.height / 2;
                charEl.style.transform = `translate(${targetX}px, ${targetY}px) scale(1.12)`;
            }
            setTimeout(() => {
                if (category === 'farmhouse') {
                    router.navigate('farmhouse');
                } else {
                    router.navigate('section', { category });
                }
            }, 460);
        }

        // --- 3. 分區食材清單 ---
        const CATEGORY_NAMES = {
            farm: { name: '農田區（五穀/蔬菜）', icon: '🌾' },
            orchard: { name: '果樹區（水果）', icon: '🍎' },
            fish: { name: '魚池（魚類/海鮮）', icon: '🐟' },
            pasture: { name: '牧場區（蛋白質/肉類）', icon: '🥩' },
            greenhouse: { name: '溫室（菇類）', icon: '🍄' }
        };

        function renderSectionView(category) {
            const catInfo = CATEGORY_NAMES[category] || { name: '農場分區', icon: '🌱' };
            const items = getAllIngredientsList().filter(i => i.category === category);

            let html = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigate('farm_map')" class="cream-btn bg-white px-3 py-1.5 text-xs font-extrabold">
                            ⬅️ 返回地圖
                        </button>
                        <h2 class="text-base sm:text-lg font-extrabold">${catInfo.icon} ${catInfo.name}</h2>
                        <div class="w-16"></div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            `;

            items.forEach(item => {
                const triedCount = (item.history || []).length;
                const isUnlocked = triedCount >= 3;
                let bgClass = "bg-white";
                let statusBadge = `<span class="text-[11px] bg-gray-100 text-cream-text px-2 py-0.5 rounded-full font-extrabold">種子/未解鎖 (${triedCount}/3)</span>`;

                if (triedCount > 0) {
                    const latestReaction = item.history[item.history.length - 1].reaction;
                    if (latestReaction === 'severe') {
                        bgClass = "bg-red-50 border-red-400";
                        statusBadge = `<span class="text-[11px] bg-cream-red text-white px-2 py-0.5 rounded-full font-extrabold">⚠️ 重度過敏</span>`;
                    } else if (latestReaction === 'moderate') {
                        bgClass = "bg-yellow-50 border-yellow-400";
                        statusBadge = `<span class="text-[11px] bg-cream-yellow text-white px-2 py-0.5 rounded-full font-extrabold">⚡ 中度過敏</span>`;
                    } else if (latestReaction === 'mild') {
                        bgClass = "bg-orange-50 border-orange-300";
                        statusBadge = `<span class="text-[11px] bg-orange-200 text-cream-text px-2 py-0.5 rounded-full font-extrabold">💧 輕微過敏</span>`;
                    } else if (isUnlocked) {
                        bgClass = "bg-emerald-50 border-emerald-400";
                        statusBadge = `<span class="text-[11px] bg-cream-green text-white px-2 py-0.5 rounded-full font-extrabold">✨ 已解鎖圖鑑卡!</span>`;
                    } else {
                        statusBadge = `<span class="text-[11px] bg-cream-secondary text-cream-text px-2 py-0.5 rounded-full font-extrabold">🌱 試吃中 (${triedCount}/3)</span>`;
                    }
                }

                html += `
                    <div onclick="openIngredientDetail('${escapeHtml(item.id)}')" class="${bgClass} cream-box p-3.5 cursor-pointer flex items-center justify-between hover:scale-[1.01] transition">
                        <div class="flex items-center space-x-3 min-w-0">
                            ${renderIngredientVisual(item, "w-14 h-14", "text-3xl")}
                            <div class="min-w-0">
                                <h3 class="font-extrabold text-base text-cream-text truncate">${escapeHtml(item.name)}</h3>
                                ${item.nameEn ? `<p class="text-[11px] text-cream-muted font-bold truncate">${escapeHtml(item.nameEn)}</p>` : ''}
                                <div class="mt-1">${statusBadge}</div>
                            </div>
                        </div>
                        <span class="text-lg ml-2">👉</span>
                    </div>
                `;
            });

            html += `</div></div>`;
            return html;
        }

        // --- 精簡版食材詳情與三天挑戰打卡彈窗 ---
        function openIngredientDetail(itemId) {
            const item = findIngredientById(itemId);
            if (!item) return;

            const triedCount = (item.history || []).length;
            const todayStr = new Date().toISOString().split('T')[0];

            // 三天挑戰虛線圓圈印章
            const stampsHtml = [0, 1, 2].map(idx => {
                const rec = item.history[idx];
                if (rec) {
                    const colorMap = {
                        none: 'bg-cream-green text-white border-cream-text',
                        mild: 'bg-orange-200 text-cream-text border-cream-text',
                        moderate: 'bg-cream-yellow text-white border-cream-text',
                        severe: 'bg-cream-red text-white border-cream-text'
                    };
                    return `
                        <div class="flex flex-col items-center">
                            <div class="w-12 h-12 rounded-full border-2 ${colorMap[rec.reaction] || colorMap.none} flex items-center justify-center font-extrabold text-base shadow-sm">
                                ✓
                            </div>
                            <span class="text-[10px] font-bold text-cream-muted mt-1">${escapeHtml(rec.date.slice(5))}</span>
                        </div>
                    `;
                }
                return `
                    <div class="flex flex-col items-center">
                        <div class="w-12 h-12 rounded-full border-2 border-dashed border-cream-text/40 bg-white flex items-center justify-center font-extrabold text-xs text-cream-muted">
                            第${idx + 1}天
                        </div>
                        <span class="text-[10px] text-cream-muted/60 mt-1">未打卡</span>
                    </div>
                `;
            }).join('');

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center space-x-2.5">
                        ${renderIngredientVisual(item, "w-12 h-12", "text-2xl")}
                        <div>
                            <h3 class="text-lg font-extrabold text-cream-text">${escapeHtml(item.name)}</h3>
                            ${item.nameEn ? `<p class="text-xs font-bold text-cream-muted">${escapeHtml(item.nameEn)}</p>` : ''}
                        </div>
                    </div>
                    <button onclick="closeModal()" class="cream-btn px-3 py-1 bg-white text-xs font-extrabold">✕ 關閉</button>
                </div>

                <div class="space-y-3.5 text-sm">
                    <!-- 準備方式 -->
                    <div class="bg-white p-3 rounded-2xl border-2 border-cream-text">
                        <h4 class="font-extrabold text-xs text-cream-primary mb-1">🍳 準備方式與切法建議</h4>
                        <p class="text-xs text-cream-text leading-relaxed">${escapeHtml(item.prep)}</p>
                    </div>

                    <!-- 三天挑戰印章區 -->
                    <div class="bg-cream-secondary/40 p-3 rounded-2xl border-2 border-cream-text">
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="font-extrabold text-xs text-cream-text">🛡️ 三天挑戰進度 (${triedCount}/3)</h4>
                            <button onclick="closeModal(); router.navigate('calendar');" class="text-[11px] font-extrabold text-cream-accent underline">前往週曆管理紀錄 →</button>
                        </div>
                        <div class="flex justify-around items-center py-1">
                            ${stampsHtml}
                        </div>
                    </div>

                    <!-- 新增試吃紀錄表單 -->
                    <div class="bg-white p-4 rounded-2xl border-2 border-cream-text space-y-2.5">
                        <h4 class="font-extrabold text-xs text-cream-text">📝 新增本次試吃打卡</h4>
                        <form onsubmit="handleRecordSubmit(event, '${escapeHtml(itemId)}')" class="space-y-2.5">
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[11px] font-extrabold mb-1">日期：</label>
                                    <input type="date" id="rec-date" value="${todayStr}" class="w-full p-2 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-bold" required>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-extrabold mb-1">份量：</label>
                                    <input type="text" id="rec-amount" placeholder="例如: 30ml / 2口" class="w-full p-2 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-bold" required>
                                </div>
                            </div>
                            <div>
                                <label class="block text-[11px] font-extrabold mb-1">過敏反應觀察：</label>
                                <select id="rec-reaction" class="w-full p-2 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-extrabold">
                                    <option value="none">🟢 無過敏反應 (安全通過)</option>
                                    <option value="mild">⚪ 輕微過敏反應 (輕微紅疹/流鼻水)</option>
                                    <option value="moderate">🟡 中度過敏反應 (紅疹擴大/輕微嘔吐)</option>
                                    <option value="severe">🔴 重度過敏反應 (嚴重過敏需就醫)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-extrabold mb-1">備註 (喜好度/反應)：</label>
                                <input type="text" id="rec-notes" placeholder="例如: 吃得很開心、吞嚥順暢..." class="w-full p-2 border-2 border-cream-text rounded-xl text-xs bg-cream-bg">
                            </div>
                            <button type="submit" class="w-full bg-cream-primary hover:bg-cream-primary/90 text-white font-extrabold py-2.5 cream-btn text-xs sm:text-sm">
                                💾 儲存打卡紀錄 (${triedCount === 2 ? '🎉 集滿3次解鎖圖鑑卡!' : '🌱 記錄成長'})
                            </button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function handleRecordSubmit(event, itemId) {
            event.preventDefault();
            const date = document.getElementById('rec-date').value;
            const amount = document.getElementById('rec-amount').value.trim();
            const reaction = document.getElementById('rec-reaction').value;
            const notes = document.getElementById('rec-notes').value.trim();

            const item = findIngredientById(itemId);
            if (!item) return;

            const prevCount = item.history.length;
            item.history.push({ date, amount, reaction, notes });
            saveState();
            closeModal();

            // 剛好集滿 3 次時，在螢幕中央跳出圖鑑卡解鎖彈窗
            if (prevCount < 3 && item.history.length >= 3) {
                openUnlockCardModal(item);
            } else {
                showToast(`🎉 已記錄 ${item.name}（目前 ${item.history.length}/3 次）`);
            }

            renderView(router.currentView, router.currentParams);
        }

        // 螢幕中央圖鑑卡解鎖彈窗
        function openUnlockCardModal(item) {
            const latestRec = item.history[item.history.length - 1] || { reaction: 'none' };
            const cleanUrl = normalizeCloudImageUrl(item.imageUrl);
            const triedCount = item.history.length;

            const artHtml = cleanUrl
                ? `<img src="${escapeHtml(cleanUrl)}" alt="${escapeHtml(item.name)}" class="w-36 h-36 mx-auto rounded-2xl border-3 border-cream-text object-cover bg-white shadow-md">`
                : `<div class="w-36 h-36 mx-auto rounded-2xl border-3 border-cream-text bg-white flex items-center justify-center text-6xl shadow-md">✨</div>`;

            const overlay = document.getElementById('unlock-card-overlay');
            const content = document.getElementById('unlock-card-content');
            content.innerHTML = `
                <div class="inline-block bg-cream-accent text-white text-xs font-extrabold px-3 py-1 rounded-full border-2 border-cream-text mb-3">
                    🎊 恭喜解鎖新圖鑑卡！
                </div>

                <div class="my-2">
                    ${artHtml}
                </div>

                <h3 class="text-2xl font-extrabold text-cream-text mt-3">${escapeHtml(item.name)}</h3>
                ${item.nameEn ? `<p class="text-xs font-extrabold text-cream-muted uppercase tracking-wider mt-0.5">${escapeHtml(item.nameEn)}</p>` : ''}

                <div class="flex items-center justify-center space-x-2 mt-3">
                    <span class="text-xs px-2.5 py-1 rounded-full font-extrabold border border-cream-text ${getReactionBadgeClass(latestRec.reaction)}">
                        ${getReactionText(latestRec.reaction)}
                    </span>
                    <span class="text-xs px-2.5 py-1 rounded-full font-extrabold bg-white border border-cream-text text-cream-text">
                        試吃 ${triedCount}/3 次
                    </span>
                </div>

                <button onclick="closeUnlockCardModal()" class="mt-5 w-full bg-cream-green hover:bg-cream-green/90 text-white font-extrabold py-3 cream-btn text-sm">
                    📖 收入食材圖鑑
                </button>
            `;
            overlay.classList.remove('hidden');
        }

        function closeUnlockCardModal() {
            document.getElementById('unlock-card-overlay').classList.add('hidden');
        }

        function getReactionText(reaction) {
            switch (reaction) {
                case 'none': return '🟢 無過敏';
                case 'mild': return '⚪ 輕微過敏';
                case 'moderate': return '🟡 中度過敏';
                case 'severe': return '🔴 重度過敏';
                default: return '🟢 無過敏';
            }
        }

        function getReactionBadgeClass(reaction) {
            switch (reaction) {
                case 'none': return 'bg-emerald-100 text-emerald-800';
                case 'mild': return 'bg-orange-100 text-cream-text';
                case 'moderate': return 'bg-yellow-200 text-yellow-900';
                case 'severe': return 'bg-red-500 text-white';
                default: return 'bg-emerald-100 text-emerald-800';
            }
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        // --- 4. 農舍（30項成就立可拍寫真牆） ---
        function renderFarmhouseView() {
            const unlockedCount = state.achievements.length;
            let html = `
                <div class="space-y-5">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigate('farm_map')" class="cream-btn bg-white px-3 py-1.5 text-xs font-extrabold">
                            ⬅️ 返回地圖
                        </button>
                        <h2 class="text-base sm:text-lg font-extrabold">🏡 農舍成就寫真牆 (${unlockedCount}/30)</h2>
                        <div class="w-16"></div>
                    </div>

                    <p class="text-xs text-cream-muted font-bold text-center">✨ 達成農場里程碑即可解鎖立可拍相框，點擊相框可從手機相簿上傳寶寶照片！</p>

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            `;

            ACHIEVEMENTS_LIST.forEach(ach => {
                const isUnlocked = state.achievements.includes(ach.id);
                const polaroidData = state.polaroids[ach.id] || {};
                const cleanUrl = normalizeCloudImageUrl(polaroidData.imageUrl);

                const photoImg = cleanUrl
                    ? `<img src="${escapeHtml(cleanUrl)}" class="w-full aspect-square object-cover border-2 border-cream-text rounded bg-white">`
                    : `<div class="w-full aspect-square bg-cream-secondary/40 border-2 border-cream-text rounded flex items-center justify-center text-4xl">${ach.icon}</div>`;

                html += `
                    <div class="polaroid cursor-pointer ${isUnlocked ? '' : 'opacity-55 grayscale'}" onclick="openPolaroidModal('${ach.id}')">
                        ${photoImg}
                        <div class="mt-2 text-center">
                            <div class="font-extrabold text-xs text-cream-text truncate">${escapeHtml(ach.title)}</div>
                            <div class="text-[10px] font-bold text-cream-muted mt-0.5">
                                ${isUnlocked ? (polaroidData.date || '已解鎖 ✨') : '🔒 未解鎖'}
                            </div>
                        </div>
                    </div>
                `;

            html += `</div></div>`;

        async function handlePolaroidFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            try {
                showToast('⏳ 正在處理相片...');
                const compressedBase64 = await compressImageFile(file, 720, 0.8);

                const placeholder = document.getElementById('polaroid-preview-placeholder');
                const previewImg = document.getElementById('polaroid-preview-img');
                if (placeholder) placeholder.classList.add('hidden');
                if (previewImg) {
                    previewImg.src = compressedBase64;
                    previewImg.classList.remove('hidden');
                }

                    showToast('☁️ 正在上傳相片至 Google 雲端硬碟...');

                    showToast('✅ 相片已存入雲端硬碟！請點擊「儲存立可拍相片」同步給家人');

                showToast('⚠️ 相片上傳失敗（請確認 GAS 已更新部署並授權雲端硬碟權限）');

        // --- 6. 食材總圖鑑頁面（雙列篩選） ---
        function renderEncyclopediaView() {
            const allItems = getAllIngredientsList();
            const filtered = allItems.filter(item => {
                const matchCat = encyclopediaFilterCat === 'all' || item.category === encyclopediaFilterCat;
                const triedCount = (item.history || []).length;
                const isUnlocked = triedCount >= 3;
                const hasAllergy = (item.history || []).some(h => h.reaction !== 'none');

                let matchStatus = true;
                if (encyclopediaFilterStatus === 'unlocked') matchStatus = isUnlocked;
                else if (encyclopediaFilterStatus === 'trying') matchStatus = triedCount > 0 && !isUnlocked;
                else if (encyclopediaFilterStatus === 'untried') matchStatus = triedCount === 0;
                else if (encyclopediaFilterStatus === 'allergy') matchStatus = hasAllergy;

                return matchCat && matchStatus;
            });

            const catTabs = [
                { id: 'all', label: '全部區域' },
                { id: 'farm', label: '🌾 農田' },
                { id: 'orchard', label: '🍎 果樹' },
                { id: 'fish', label: '🐟 魚池' },
                { id: 'pasture', label: '🥩 牧場' },
                { id: 'greenhouse', label: '🍄 溫室' }
            ];

            const statusTabs = [
                { id: 'all', label: '全部狀態' },
                { id: 'unlocked', label: '✨ 已解鎖' },
                { id: 'trying', label: '🌱 試吃中' },
                { id: 'untried', label: '❓ 未嘗試' },

                            <button onclick="manualCloudSync()" class="cream-btn bg-cream-secondary px-2.5 py-1.5 text-xs font-extrabold">

                            </button>
                        ` : '<div class="w-16"></div>'}
                    </div>

                    <div class="bg-white p-3 rounded-2xl border-2 border-cream-text space-y-2">
                        <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                            ${catTabs.map(t => `
                                <button onclick="encyclopediaFilterCat='${t.id}'; renderView('encyclopedia');"
                                        class="px-2.5 py-1 rounded-full text-xs font-extrabold whitespace-nowrap border-2 ${encyclopediaFilterCat === t.id ? 'bg-cream-primary text-white border-cream-text' : 'bg-cream-bg text-cream-text border-transparent'}">
                                    ${t.label}
                                </button>
                            `).join('')}

                        <div class="flex gap-1.5 overflow-x-auto no-scrollbar pt-0.5 border-t border-dashed border-cream-text/20">
                            ${statusTabs.map(t => `
                                <button onclick="encyclopediaFilterStatus='${t.id}'; renderView('encyclopedia');"
                                        class="px-2.5 py-1 rounded-full text-xs font-extrabold whitespace-nowrap border-2 ${encyclopediaFilterStatus === t.id ? 'bg-cream-text text-white border-cream-text' : 'bg-cream-secondary/40 text-cream-text border-transparent'}">
                                    ${t.label}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            `;

                html += `<div class="col-span-full bg-white cream-box p-8 text-center text-xs font-bold text-cream-muted">找不到符合篩選條件的食材 🌱</div>`;
            } else {

                                <h4 class="font-extrabold text-xs sm:text-sm truncate text-cream-text">${escapeHtml(item.name)}</h4>
                                <p class="text-[10px] font-bold text-cream-muted mt-0.5">${isUnlocked ? '✨ 已解鎖圖鑑' : `🌱 試吃中 (${triedCount}/3)`}</p>

        // --- 7. 直列式一週週曆與全部紀錄管理 ---
        function renderCalendarView() {
            const records = getAllRecords();
            const recordMap = {};
            records.forEach(r => {
                if (!recordMap[r.date]) recordMap[r.date] = [];
                recordMap[r.date].push(r);
            });

            // 計算當週週一至週日
            const baseDate = new Date();
            baseDate.setDate(baseDate.getDate() + calendarWeekOffset * 7);
            const dayOfWeek = baseDate.getDay();
            const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const monday = new Date(baseDate);
            monday.setDate(baseDate.getDate() + diffToMonday);

            const weekDays = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
            const todayStr = new Date().toISOString().split('T')[0];

            let rowsHtml = '';
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const dateStr = `${yyyy}-${mm}-${dd}`;
                const dayRecs = recordMap[dateStr] || [];
                const isToday = dateStr === todayStr;

                const tagsHtml = dayRecs.length === 0
                    ? `<span class="text-xs text-cream-muted/60 italic">尚無紀錄</span>`
                    : dayRecs.map(r => `
                        <button onclick="openEditRecordModal('${escapeHtml(r.ingredientId)}', ${r.recordIndex})"
                                class="text-xs font-extrabold px-2.5 py-1 rounded-xl border-2 border-cream-text shadow-sm flex items-center space-x-1 ${getReactionBadgeClass(r.reaction)}">
                            <span>${escapeHtml(r.ingredientName)}</span>
                            <span class="opacity-80 text-[10px]">(${escapeHtml(r.amount)})</span>
                        </button>
                    `).join('');

                rowsHtml += `
                    <div class="bg-white rounded-2xl border-2 ${isToday ? 'border-cream-accent bg-cream-secondary/25' : 'border-cream-text'} p-3 flex items-start space-x-3">
                        <div class="w-16 shrink-0 text-center border-r-2 border-dashed border-cream-text/20 pr-2">
                            <div class="text-xs font-extrabold ${isToday ? 'text-cream-accent' : 'text-cream-muted'}">${weekDays[i]}</div>
                            <div class="text-sm font-extrabold text-cream-text mt-0.5">${mm}/${dd}</div>
                        </div>
                        <div class="flex-1 flex flex-wrap gap-1.5 items-center min-h-[36px]">
                            ${tagsHtml}
                        </div>
                    </div>
                `;
            }

            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            const rangeTitle = `${monday.getMonth() + 1}/${monday.getDate()} - ${sunday.getMonth() + 1}/${sunday.getDate()}`;

            return `
                <div class="space-y-4 max-w-2xl mx-auto">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigate('home')" class="cream-btn bg-white px-3 py-1.5 text-xs font-extrabold">
                            ⬅️ 返回首頁
                        </button>
                        <h2 class="text-base sm:text-lg font-extrabold">📅 副食品飲食週曆</h2>
                        <button onclick="openAllRecordsManagerModal()" class="cream-btn bg-cream-secondary px-3 py-1.5 text-xs font-extrabold">
                            📋 管理全部紀錄
                        </button>
                    </div>

                    <!-- 週次切換列 -->
                    <div class="bg-white cream-box p-3 flex items-center justify-between">
                        <button onclick="calendarWeekOffset--; renderView('calendar');" class="cream-btn bg-cream-bg px-3 py-1 text-xs font-extrabold">◀ 上一週</button>
                        <div class="text-center">
                            <div class="text-sm font-extrabold text-cream-text">${rangeTitle}</div>
                            ${calendarWeekOffset !== 0 ? `<button onclick="calendarWeekOffset=0; renderView('calendar');" class="text-[10px] font-extrabold text-cream-accent underline">回到本週</button>` : '<span class="text-[10px] font-bold text-cream-green">本週紀錄</span>'}
                        </div>
                        <button onclick="calendarWeekOffset++; renderView('calendar');" class="cream-btn bg-cream-bg px-3 py-1 text-xs font-extrabold">下一週 ▶</button>
                    </div>

                    <!-- 直列式一週 7 天卡片 -->
                    <div class="space-y-2.5">
                        ${rowsHtml}
                    </div>
                    <p class="text-xs text-cream-muted font-bold text-center">💡 點擊任一食物標籤可直接修改或刪除該筆紀錄</p>
                </div>
            `;
        }

        // 編輯單筆試吃紀錄彈窗
        function openEditRecordModal(itemId, recIndex) {
            const item = findIngredientById(itemId);
            if (!item || !item.history[recIndex]) return;
            const rec = item.history[recIndex];

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-extrabold">✏️ 編輯紀錄：${escapeHtml(item.name)}</h3>
                    <button onclick="closeModal()" class="cream-btn px-3 py-1 bg-white text-xs font-extrabold">✕ 關閉</button>
                </div>
                <form onsubmit="handleEditRecordSubmit(event, '${escapeHtml(itemId)}', ${recIndex})" class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs font-extrabold mb-1">日期：</label>
                        <input type="date" id="edit-rec-date" value="${escapeHtml(rec.date)}" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-bold" required>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold mb-1">份量：</label>
                        <input type="text" id="edit-rec-amount" value="${escapeHtml(rec.amount)}" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-bold" required>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold mb-1">過敏反應：</label>
                        <select id="edit-rec-reaction" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-extrabold">
                            <option value="none" ${rec.reaction === 'none' ? 'selected' : ''}>🟢 無過敏反應</option>
                            <option value="mild" ${rec.reaction === 'mild' ? 'selected' : ''}>⚪ 輕微過敏反應</option>
                            <option value="moderate" ${rec.reaction === 'moderate' ? 'selected' : ''}>🟡 中度過敏反應</option>
                            <option value="severe" ${rec.reaction === 'severe' ? 'selected' : ''}>🔴 重度過敏反應</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold mb-1">備註：</label>
                        <input type="text" id="edit-rec-notes" value="${escapeHtml(rec.notes || '')}" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-1 bg-cream-primary text-white font-extrabold py-2.5 cream-btn text-xs">
                            💾 儲存修改
                        </button>
                        <button type="button" onclick="deleteSingleRecord('${escapeHtml(itemId)}', ${recIndex}, true)" class="bg-red-50 hover:bg-red-100 text-cream-red font-extrabold px-4 py-2.5 cream-btn text-xs">
                            🗑️ 刪除這筆
                        </button>
                    </div>
                </form>
            `;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function handleEditRecordSubmit(event, itemId, recIndex) {
            event.preventDefault();
            const item = findIngredientById(itemId);
            if (!item || !item.history[recIndex]) return;

            item.history[recIndex] = {
                date: document.getElementById('edit-rec-date').value,
                amount: document.getElementById('edit-rec-amount').value.trim(),
                reaction: document.getElementById('edit-rec-reaction').value,
                notes: document.getElementById('edit-rec-notes').value.trim()
            };
            saveState();
            closeModal();
            showToast('✅ 已更新試吃紀錄！');
            renderView(router.currentView, router.currentParams);
        }

        function deleteSingleRecord(itemId, recIndex, closeAfter = false) {
            const item = findIngredientById(itemId);
            if (!item || !item.history[recIndex]) return;
            item.history.splice(recIndex, 1);
            saveState();
            showToast('🗑️ 已刪除該筆紀錄');
            if (closeAfter) {
                closeModal();
                renderView(router.currentView, router.currentParams);
            } else {
                openAllRecordsManagerModal();
                renderView(router.currentView, router.currentParams);
            }
        }

        // 管理全部歷史紀錄 Modal
        function openAllRecordsManagerModal() {
            const allRecords = getAllRecords().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            const filtered = allRecords.filter(r =>
                !recordManagerSearch ||
                r.ingredientName.includes(recordManagerSearch) ||
                (r.date && r.date.includes(recordManagerSearch)) ||
                (r.notes && r.notes.includes(recordManagerSearch))
            );

            const listHtml = filtered.length === 0
                ? `<p class="text-center text-xs text-cream-muted py-6">目前沒有符合的歷史紀錄</p>`
                : filtered.map(r => `
                    <div class="bg-white p-3 rounded-xl border-2 border-cream-text flex items-center justify-between gap-2">
                        <div class="min-w-0">
                            <div class="flex items-center space-x-2">
                                <span class="font-extrabold text-xs text-cream-text">${escapeHtml(r.ingredientName)}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${getReactionBadgeClass(r.reaction)}">${getReactionText(r.reaction)}</span>
                            </div>
                            <div class="text-[11px] text-cream-muted mt-0.5">📅 ${escapeHtml(r.date)} ｜ 份量：${escapeHtml(r.amount)}</div>
                            ${r.notes ? `<div class="text-[10px] text-cream-text/80 truncate mt-0.5">📝 ${escapeHtml(r.notes)}</div>` : ''}
                        </div>
                        <div class="flex items-center space-x-1.5 shrink-0">
                            <button onclick="openEditRecordModal('${escapeHtml(r.ingredientId)}', ${r.recordIndex})" class="cream-btn bg-cream-secondary px-2.5 py-1 text-[11px] font-extrabold">編輯</button>
                            <button onclick="deleteSingleRecord('${escapeHtml(r.ingredientId)}', ${r.recordIndex}, false)" class="cream-btn bg-red-50 text-cream-red px-2.5 py-1 text-[11px] font-extrabold">刪除</button>
                        </div>
                    </div>
                `).join('');

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-extrabold">📋 全部試吃歷史紀錄 (${allRecords.length} 筆)</h3>
                    <button onclick="closeModal()" class="cream-btn px-3 py-1 bg-white text-xs font-extrabold">✕ 關閉</button>
                </div>
                <input type="text" value="${escapeHtml(recordManagerSearch)}" oninput="recordManagerSearch=this.value; openAllRecordsManagerModal();"
                       placeholder="🔍 搜尋食材名稱、日期或備註..." class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-white mb-3">
                <div class="space-y-2 max-h-[60vh] overflow-y-auto no-scrollbar">
                    ${listHtml}
                </div>
            `;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        // --- 8. 食用須知頁面 ---
        function renderGuidelinesView() {
            return `
                <div class="space-y-4 max-w-2xl mx-auto">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigate('home')" class="cream-btn bg-white px-3 py-1.5 text-xs font-extrabold">
                            ⬅️ 返回首頁
                        </button>
                        <h2 class="text-base sm:text-lg font-extrabold">💡 副食品醫學常識與須知</h2>
                        <div class="w-16"></div>
                    </div>

                    <div class="space-y-3.5 text-sm">
                        <div class="bg-white cream-box p-5 space-y-2">
                            <h3 class="font-extrabold text-base text-cream-primary flex items-center space-x-2">
                                <span>🍼</span><span>何時開始添加副食品？</span>
                            </h3>
                            <p class="text-xs text-cream-text leading-relaxed">
                                建議寶寶滿 4～6 個月大、頸部支撐力穩定且對大人食物展現興趣時開始嘗試副食品。6 個月起寶寶體內儲存的鐵質逐漸消耗，需透過富含鐵質的副食品補充營養。
                            </p>
                        </div>

                        <div class="bg-white cream-box p-5 space-y-2">
                            <h3 class="font-extrabold text-base text-cream-primary flex items-center space-x-2">
                                <span>🛡️</span><span>「三天挑戰法」與過敏觀察</span>
                            </h3>
                            <p class="text-xs text-cream-text leading-relaxed">
                                每次引入新食材建議連續觀察 3 天（本農場集滿 3 次打卡即解鎖圖鑑卡），期間不混入其他新食材。若出現皮膚紅疹、腹瀉或嘔吐，請先暫停餵食並紀錄過敏等級。
                            </p>
                        </div>

                        <div class="bg-white cream-box p-5 space-y-2">
                            <h3 class="font-extrabold text-base text-cream-red flex items-center space-x-2">
                                <span>⚠️</span><span>1 歲以下絕對禁止的食物</span>
                            </h3>
                            <ul class="text-xs text-cream-text space-y-1.5 list-disc list-inside leading-relaxed">
                                <li><strong>蜂蜜：</strong>可能含有肉毒桿菌孢子，1 歲以下嬰兒腸道尚未成熟，嚴禁食用。</li>
                                <li><strong>未全熟蛋、肉、海鮮：</strong>避免沙門氏菌或寄生蟲感染風險。</li>
                                <li><strong>整顆堅果與圓形硬食：</strong>如花生、整顆葡萄、果凍，容易造成呼吸道噎食。</li>
                                <li><strong>額外添加鹽、糖與調味料：</strong>1 歲前以天然食材原味為主，保護寶寶腎臟。</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 9. 過敏警示食材專區 ---
        function renderAllergyView() {
            const allergicItems = getAllIngredientsList().filter(ing =>
                (ing.history || []).some(h => h.reaction === 'mild' || h.reaction === 'moderate' || h.reaction === 'severe')
            );

            let html = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigate('home')" class="cream-btn bg-white px-3 py-1.5 text-xs font-extrabold">
                            ⬅️ 返回首頁
                        </button>
                        <h2 class="text-base sm:text-lg font-extrabold">⚠️ 過敏警示食材專區</h2>
                        <div class="w-16"></div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            `;

            if (allergicItems.length === 0) {
                html += `
                    <div class="col-span-full bg-white cream-box p-8 text-center text-cream-muted">
                        <span class="text-4xl">🟢</span>
                        <p class="mt-2 font-extrabold text-sm">目前沒有任何過敏警示食材，寶寶適應得很好！</p>
                    </div>
                `;
            } else {
                allergicItems.forEach(item => {
                    const latest = item.history[item.history.length - 1];
                    html += `
                        <div onclick="openIngredientDetail('${escapeHtml(item.id)}')" class="bg-white cream-box p-4 cursor-pointer flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                ${renderIngredientVisual(item, "w-14 h-14", "text-3xl")}
                                <div>
                                    <h3 class="font-extrabold text-base text-cream-text">${escapeHtml(item.name)}</h3>
                                    <p class="text-xs text-cream-muted mt-0.5">最近紀錄：${escapeHtml(latest.date)}</p>
                                    <span class="inline-block mt-1 text-xs px-2 py-0.5 rounded-full font-extrabold ${getReactionBadgeClass(latest.reaction)}">
                                        ${getReactionText(latest.reaction)}
                                    </span>
                                </div>
                            </div>
                            <span class="text-lg">👉</span>
                        </div>
                    `;
                });
            }

            html += `</div></div>`;
            return html;
        }

        // ==================== 8. 快速新增與自訂食材彈窗 ====================
        let quickAddFilterCat = 'all';

        function openQuickAddModal() {
            const todayStr = new Date().toISOString().split('T')[0];
            const allItems = getAllIngredientsList().filter(i => quickAddFilterCat === 'all' || i.category === quickAddFilterCat);
            const optionsHtml = allItems.map(i => `<option value="${escapeHtml(i.id)}">${escapeHtml(i.name)} (${(i.history || []).length}/3)</option>`).join('');

            const catButtons = [
                { id: 'all', label: '全部' },
                { id: 'farm', label: '🌾 農田' },
                { id: 'orchard', label: '🍎 果樹' },
                { id: 'fish', label: '🐟 魚池' },
                { id: 'pasture', label: '🥩 牧場' },
                { id: 'greenhouse', label: '🍄 溫室' }
            ].map(c => `
                <button type="button" onclick="quickAddFilterCat='${c.id}'; openQuickAddModal();"
                        class="px-2 py-1 rounded-full text-[11px] font-extrabold border ${quickAddFilterCat === c.id ? 'bg-cream-primary text-white border-cream-text' : 'bg-cream-bg text-cream-text border-cream-text/30'}">
                    ${c.label}
                </button>
            `).join('');

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-extrabold">⚡ 快速新增今天吃了什麼</h3>
                    <button onclick="closeModal()" class="cream-btn px-3 py-1 bg-white text-xs font-extrabold">✕ 關閉</button>
                </div>

                <div class="flex gap-1 overflow-x-auto no-scrollbar mb-3">
                    ${catButtons}
                </div>

                <form onsubmit="handleQuickAddSubmit(event)" class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs font-extrabold mb-1">選擇食材：</label>
                        <select id="quick-item-id" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-extrabold">
                            ${optionsHtml}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-extrabold mb-1">日期：</label>
                            <input type="date" id="quick-date" value="${todayStr}" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-bold" required>
                        </div>
                        <div>
                            <label class="block text-xs font-extrabold mb-1">份量：</label>
                            <input type="text" id="quick-amount" placeholder="例如: 40ml" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-bold" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold mb-1">過敏反應：</label>
                        <select id="quick-reaction" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-extrabold">
                            <option value="none">🟢 無過敏反應</option>
                            <option value="mild">⚪ 輕微過敏</option>
                            <option value="moderate">🟡 中度過敏</option>
                            <option value="severe">🔴 重度過敏</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold mb-1">備註：</label>
                        <input type="text" id="quick-notes" placeholder="寶寶吃得很開心..." class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg">
                    </div>
                    <button type="submit" class="w-full bg-cream-primary text-white font-extrabold py-3 cream-btn text-sm">
                        💾 快速儲存記錄
                    </button>
                </form>
            `;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function handleQuickAddSubmit(event) {
            event.preventDefault();
            const itemId = document.getElementById('quick-item-id').value;
            const date = document.getElementById('quick-date').value;
            const amount = document.getElementById('quick-amount').value.trim();
            const reaction = document.getElementById('quick-reaction').value;
            const notes = document.getElementById('quick-notes').value.trim();

            const item = findIngredientById(itemId);
            if (!item) return;

            const prevCount = item.history.length;
            item.history.push({ date, amount, reaction, notes });
            saveState();
            closeModal();

            if (prevCount < 3 && item.history.length >= 3) {
                openUnlockCardModal(item);
            } else {
                showToast(`⚡ 成功快速記錄 ${item.name}！`);
            }
            renderView(router.currentView, router.currentParams);
        }

        function openAddCustomModal() {
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-extrabold">➕ 新增圖鑑外自訂食材</h3>
                    <button onclick="closeModal()" class="cream-btn px-3 py-1 bg-white text-xs font-extrabold">✕ 關閉</button>
                </div>
                <form onsubmit="handleCustomSubmit(event)" class="space-y-3.5 text-sm">
                    <div>
                        <label class="block text-xs font-extrabold mb-1">食材中文名稱：</label>
                        <input type="text" id="custom-name" placeholder="例如: 寶寶米餅" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-extrabold" required>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold mb-1">食材英文名稱（選填）：</label>
                        <input type="text" id="custom-name-en" placeholder="例如: Baby Rice Cracker" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg">
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold mb-1">所屬農場分區：</label>
                        <select id="custom-cat" class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg font-extrabold">
                            <option value="farm">🌾 農田區（五穀/蔬菜）</option>
                            <option value="orchard">🍎 果樹區（水果）</option>
                            <option value="fish">🐟 魚池（魚類/海鮮）</option>
                            <option value="pasture">🥩 牧場區（蛋白質/肉類）</option>
                            <option value="greenhouse">🍄 溫室（菇類）</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold mb-1">準備方式建議：</label>
                        <textarea id="custom-prep" placeholder="請輸入準備與切法建議..." class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg" rows="2" required></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold mb-1">解鎖插畫圖片網址（選填）：</label>
                        <input type="url" id="custom-image-url" placeholder="https://..." class="w-full p-2.5 border-2 border-cream-text rounded-xl text-xs bg-cream-bg">
                    </div>
                    <button type="submit" class="w-full bg-cream-primary text-white font-extrabold py-3 cream-btn text-sm">
                        ✨ 新增自訂食材
                    </button>
                </form>
            `;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function handleCustomSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('custom-name').value.trim();
            const nameEn = document.getElementById('custom-name-en').value.trim();
            const category = document.getElementById('custom-cat').value;
            const prep = document.getElementById('custom-prep').value.trim();
            const imageUrl = normalizeCloudImageUrl(document.getElementById('custom-image-url').value.trim());

            const newCustom = {
                id: 'custom_' + Date.now(),
                name,
                nameEn,
                category,
                seedEmoji: '❓',
                imageUrl,
                prep,
                history: []
            };

            state.customIngredients.push(newCustom);
            saveState();
            closeModal();
            showToast(`🎨 成功新增自訂食材：${name}！`);
            router.navigate('section', { category });
        }

        // ==================== 9. 啟動初始化 ====================
        window.addEventListener('DOMContentLoaded', async () => {
            updateHeaderInfo();
            checkAchievements();
            router.navigate('home');

            // 僅當使用者有在「農場主人」頁面貼上 gasUrl 時才會執行雲端同步
            await initCloudSyncOnBoot();
            if (getActiveGasUrl()) {
                renderView(router.currentView, router.currentParams);
            }
        });
    </script>
</body>
</html>
